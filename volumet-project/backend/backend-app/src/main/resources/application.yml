spring:
  application:
    name: backend-server

  # mssql configuration
  datasource:
    url: jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  # Keycloak resource server: every JWT must have iss == issuer-uri and aud containing the client id.
  # Same variables as docker/keycloak-init (KEYCLOAK_REALM, KEYCLOAK_CLIENT_ID); defaults match docker/.env.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:${KEYCLOAK_PORT:8088}/realms/${KEYCLOAK_REALM:volumet-realm}}
          audiences: ${KEYCLOAK_CLIENT_ID:volumet-app}

  cache:
    redis:
      value-serializer: org.springframework.data.redis.serializer.GenericJackson2JsonRedisSerializer

  # flyway default configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    default-schema: school
    create-schemas: true
    schemas: school
    clean-disabled: false

  # hibernate default configuration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: school
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        jdbc:
          lob:
            non_contextual_creation: true
          batch_size: 50
        order_inserts: true
        order_updates: true

server:
  port: 8080

logging:
  level:
    root: INFO

# ---- correlation: Micrometer Tracing supplies traceId; set true to re-enable CorrelationIdFilter ----
app:
  correlation:
    enabled: false

volumet:
  security:
    keycloak:
      # this service's client: its client roles (resource_access.<client>.roles) count as ROLE_ authorities too
      client-id: ${KEYCLOAK_CLIENT_ID:volumet-app}
    cors:
      # browser frontends on other origins, comma-separated (e.g. https://app.example.com); empty = CORS off
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
