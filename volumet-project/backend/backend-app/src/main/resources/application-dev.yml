spring:
  # issuer-uri / audiences: see application.yml
  jpa:
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true
        format_sql: true
        hightlight_sql: true

logging:
  level:
    org:
      flywaydb: DEBUG
      springframework:
        security: DEBUG
        web: DEBUG
        cache: TRACE
        boot:
          autoconfigure: INFO
      hibernate:
        engine.jdbc.batch.internal: DEBUG
        stat: DEBUG
        cache: TRACE

springdoc:
  swagger-ui:
    path: /swagger
    operations-sorter: method
  api-docs:
    path: /api-docs

app:
  correlation:
    enabled: false

# ---- tracing: sample every request locally; the default is 10% ----
management:
  tracing:
    sampling:
      probability: 1.0
