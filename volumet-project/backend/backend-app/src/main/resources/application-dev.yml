spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:${KEYCLOAK_PORT}/realms/volumet-realm
          audiences: volumet-app
  jpa:
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true
        format_sql: true
        hightlight_sql: true

logging:
  level:
    org:
      flywaydb: DEBUG
      springframework:
        security: DEBUG
        web: DEBUG
        cache: TRACE
        boot:
          autoconfigure: INFO
      hibernate:
        engine.jdbc.batch.internal: DEBUG
        stat: DEBUG
        cache: TRACE

springdoc:
  swagger-ui:
    path: /swagger
    operations-sorter: method
  api-docs:
    path: /api-docs

app:
  security:
    enabled: true
  correlation:
    enabled: true