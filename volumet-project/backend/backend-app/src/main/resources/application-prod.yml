spring:
  lifecycle:
    timeout-per-shutdown-phase: "20s"
  jpa:
    show-sql: false
  flyway:
    clean-disabled: true
  # No default in prod: the app fails to start if KEYCLOAK_ISSUER_URI is missing.
  # audiences comes from application.yml (KEYCLOAK_CLIENT_ID).
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

app:
  correlation:
    enabled: true