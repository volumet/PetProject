version: '3.9'

services:
 sqlserver:
   image: mcr.microsoft.com/mssql/server:2022-CU13-ubuntu-22.04
   container_name: sql2022
   ports:
    - "${DB_WSL2_PORT}:${DB_PORT}"
   env_file:
     - .env
   environment:
    ACCEPT_EULA: "Y"
    SA_PASSWORD: "${DB_PASSWORD}"
   volumes:
    - sql_data:/var/opt/mssql
    - ./docker-entrypoint-initdb.d:/init
   command: /bin/bash /init/init.sh
   networks:
    volumetnet:
     aliases:
      - sql2022
      
 redis:
  image: redis:7
  container_name: redis
  ports:
   - "${REDIS_WSL2_PORT}:${REDIS_PORT}"
  volumes: 
   - redis_data:/var/opt/redis
   - ./redis.conf:/usr/local/etc/redis/redis.conf
  command: redis-server /usr/local/etc/redis/redis.conf
  restart: unless-stopped
  networks:
    volumetnet:
      aliases:
        - redis
    
volumes:
 sql_data:
 redis_data:
 
networks:
 volumetnet:
  external: true